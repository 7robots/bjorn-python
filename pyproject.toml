[project]
name = "bjorn"
version = "0.1.0"
description = "A terminal front end for Bear notes, driven by bearcli"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jefferson Burson" }]
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
bjorn = "bjorn.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bjorn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
timeout = 60
